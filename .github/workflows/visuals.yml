name: Update profile visuals

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '23 */3 * * *'

permissions:
  contents: write

jobs:
  visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate the activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/generate_activity_graph.py

      - name: Generate the snake from the contribution calendar
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg?color_snake=purple&color_dots=#161b22,#01311f,#034525,#0f6d31,#00c647

      - name: Add calendar labels and yearly views
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/style_contribution_snake.py

      - name: Commit the SVG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/activity-graph.svg assets/contribution-snake*.svg
          if git diff --cached --quiet; then
            echo "No changes to the visuals"
            exit 0
          fi
          git commit -m "Update profile visuals"
          git push origin HEAD:main
