name: Update profile visuals

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install the pinned snake generator
        run: npm ci

      - name: Generate a snake for each calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: node scripts/generate_snakes.mjs

      - name: Add calendar labels and yearly views
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/style_contribution_snake.py

      - name: Commit the SVG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/contribution-snake*.svg
          if git diff --cached --quiet; then
            echo "No changes to the visuals"
            exit 0
          fi
          git commit -m "Update profile visuals"
          git push origin HEAD:main
