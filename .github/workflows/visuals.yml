name: Update profile visuals

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '2/5 * * * *'

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate the animated snake with Platane/snk
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg?palette=github-dark&color_snake=purple&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Read the same contribution calendar from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_github_contributions.py

      - name: Label the snake with GitHub contribution days
        run: python scripts/style_contribution_snake.py

      - name: Commit the updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg README.md
          if git diff --cached --quiet; then
            echo "No changes to the visuals"
            exit 0
          fi
          git commit -m "Update profile visuals"
          git push origin HEAD:main
